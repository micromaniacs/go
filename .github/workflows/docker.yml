name: docker

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:

concurrency:
  group: docker-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Discover latest toolchain versions
        run: |
          GO_FULL="$(curl -fsSL 'https://go.dev/dl/?mode=json' \
            | jq -r '[.[] | select(.stable == true) | .version | ltrimstr("go")] | max_by(split(".") | map(tonumber))')"
          echo "GO_MAJOR=${GO_FULL%%.*}" >> "$GITHUB_ENV"
          echo "GO_MINOR=${GO_FULL%.*}" >> "$GITHUB_ENV"
          echo "GO_FULL=${GO_FULL}" >> "$GITHUB_ENV"
          LINT_VERSION="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'Authorization: Bearer ${{ github.token }}' \
            'https://api.github.com/repos/golangci/golangci-lint/releases/latest' \
            | jq -r '.tag_name')"
          echo "LINT_VERSION=${LINT_VERSION}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Decide what to build
        id: decide
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${GO_FULL}" >/dev/null 2>&1; then
            PUBLISHED_LINT="$(docker buildx imagetools inspect \
              --format '{{ index (index .Image "linux/amd64").Config.Labels "io.micromaniacs.golangci-lint" }}' \
              "${IMAGE}:${GO_FULL}" 2>/dev/null || true)"
            if [ "${PUBLISHED_LINT}" = "${LINT_VERSION}" ]; then
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Same Go, newer lint: refresh floating tags only.
            {
              echo "build=true"
              echo "tags<<EOF"
              echo "${IMAGE}:latest"
              echo "${IMAGE}:${GO_MAJOR}"
              echo "${IMAGE}:${GO_MINOR}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "build=true"
              echo "tags<<EOF"
              echo "${IMAGE}:latest"
              echo "${IMAGE}:${GO_MAJOR}"
              echo "${IMAGE}:${GO_MINOR}"
              echo "${IMAGE}:${GO_FULL}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            GO_VERSION=${{ env.GO_FULL }}
            GOLANGCI_LINT_VERSION=${{ env.LINT_VERSION }}
          tags: ${{ steps.decide.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: docker run --rm "${IMAGE}:latest" sh -c 'go version && golangci-lint version && make --version && gcc --version && node --version && npm --version && npx --version && prettier --version && git --version'

      - name: Clean up untagged image versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-untagged: true
